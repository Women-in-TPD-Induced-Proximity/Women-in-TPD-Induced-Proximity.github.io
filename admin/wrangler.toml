# WiTPD admin portal. Setup walkthrough: admin/README.md.
name = "witpd-admin"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve the portal at admin.<domain>. Needs the domain's DNS on Cloudflare
# (Phase 1 of docs/ARCHITECTURE-PLAN.md). Until then, comment this out and
# use the workers.dev URL with Access enabled on it.
routes = [
  { pattern = "admin.womenintpdandip.org", custom_domain = true },
]

# CSS + JS for the portal itself. Served at /static/*; Cloudflare Access
# protects them along with everything else on the hostname.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "witpd-admin"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
GITHUB_OWNER = "Women-in-TPD-Induced-Proximity"
GITHUB_REPO = "Women-in-TPD-Induced-Proximity.github.io"
GITHUB_BRANCH = "main"
SITE_URL = "https://womenintpdandip.org"
# From Zero Trust → Settings → Custom pages: "<team>.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = ""
# From Zero Trust → Access → Applications → (this app) → "Application Audience (AUD) Tag".
ACCESS_AUD = ""
# GitHub App (preferred). The private key is a secret:
#   npx wrangler secret put GITHUB_APP_PRIVATE_KEY < your-app.private-key.pem
# Or leave these blank and set a fine-grained token instead:
#   npx wrangler secret put GITHUB_TOKEN
GITHUB_APP_ID = ""
GITHUB_APP_INSTALLATION_ID = ""
