# winners[].affiliation  shown after an em dash; linkedin is optional.
# photos[].photo         filename only; under /assets/images/scholarship/.
# photos[].alt           written out in full — unlike the gallery, these alt
#                        texts are descriptive sentences, not derivable.
# photos[].wide          Optional. Adds `.wide` to the tile so a group shot
#                        spans two columns of the grid.
