# Upcoming conferences, rendered by conferences.html. Authored soonest-first,
# which is what the default sort reproduces.
#
# start/end  YYYY-MM-DD. `start` doubles as the sort key, so it must stay a
#            sortable string. The month/day/year shown in the date block is
#            DERIVED from these — a single-day meeting needs only `start`, and
#            a range spanning two months renders as e.g. "Sep-Oct" / "28-1".
# display    Only for a meeting with no announced dates: leave `start` empty
#            and give the three date-block strings literally. An empty sort key
#            always sorts last (see sort.js), which is why TBA stays at the end.
