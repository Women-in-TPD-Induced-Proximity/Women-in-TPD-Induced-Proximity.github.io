- title: Induced-proximity concepts
  blurb: The vocabulary behind the modalities.
  terms:
  - name: Induced proximity
    definition: 'The unifying idea: using a chemical or biologic to force two biomolecules together to drive a programmed outcome — degradation, stabilization, modification, or relocalization.'
  - name: Targeted Protein Degradation
    abbr: TPD
    definition: A therapeutic strategy that <em>removes</em> a protein rather than merely inhibiting its activity, expanding the "druggable" proteome to scaffolding and undruggable targets.
  - name: Targeted Protein Stabilization
    abbr: TPS
    definition: The converse of TPD — deliberately increasing a protein's level or half-life, for example with a DUBTAC.
  - name: Ternary complex
    definition: The three-body assembly (target · degrader · effector, e.g. target–PROTAC–E3) that must form for a bifunctional molecule to act.
  - name: Cooperativity (α)
    definition: A measure of how much the ternary complex is stabilized (positive cooperativity) or destabilized (negative) relative to the two underlying binary interactions.
  - name: Hook effect
    definition: Loss of ternary-complex formation at high degrader concentration, as binary complexes outcompete the productive ternary one — producing a characteristic bell-shaped dose–response.
  - name: E3 ubiquitin ligase
    definition: The enzyme that transfers ubiquitin onto a substrate. Degraders co-opt E3s such as CRBN, VHL, MDM2, and the IAPs to mark new targets.
  - name: CRBN & VHL
    definition: Cereblon and von Hippel–Lindau — the two most widely used E3 recruiters in degrader design, each with well-characterized small-molecule ligands.
  - name: Neo-substrate
    definition: A protein that is not a natural client of an E3 ligase but is recruited and degraded thanks to a molecular glue or PROTAC.
  - name: Event-driven pharmacology
    definition: Activity that depends on a transient event (such as ubiquitin transfer) rather than sustained target occupancy — the basis for catalytic, sub-stoichiometric action.
  - name: Catalytic / sub-stoichiometric
    definition: A single degrader molecule can drive many rounds of target degradation, in contrast to occupancy-driven inhibitors that act one-to-one.
  - name: Linkerology
    definition: The art of tuning the chemical tether that joins the two warheads of a bifunctional degrader; linker length and composition strongly shape ternary complex formation and potency.
  - name: Degron
    definition: A sequence or chemical mark that directs a protein toward the degradation machinery.
  - name: DC50 / Dmax
    name_html: DC<sub>50</sub> / D<sub>max</sub>
    definition: Core potency metrics for degraders — the concentration giving 50% degradation, and the maximum extent of degradation achieved.
