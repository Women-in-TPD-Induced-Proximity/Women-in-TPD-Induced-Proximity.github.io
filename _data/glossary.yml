# The DicTACtionary, rendered by dictac.html. Two sections, each sorted
# independently by sort.js so the grouping survives an A-Z sort.
#
# Per term (all optional except `name`):
#   name        Plain text. Doubles as the A-Z sort key and the search text,
#               so it must stay plain — put markup in the fields below.
#   highlight   A substring of `name` wrapped in <span class="dic-tac">, which
#               is what gives PRO*TAC* its accent. Must occur exactly once.
#               Curatorial, not automatic: several names contain "TAC" without
#               being highlighted, and ATTEC highlights "TEC".
#   abbr        Renders a muted "(TPD)" after the name.
#   name_html   Escape hatch: raw inline HTML for the name, used when it needs
#               markup the two fields above cannot express (e.g. subscripts).
#   expansion   The small grey line under the name. Inline HTML allowed.
#   definition  The prose paragraph used by the concepts section. Inline HTML
#               allowed. A term has an expansion or a definition, not both.
#   refs        Zero or more URLs. Labelled "Reference" when there is one and
#               "Reference 1/2/3..." when there are several.
