# Community photo gallery, rendered by photo-gallery.html.
#
# Ordered MOST-RECENT-FIRST — add new photos at the TOP of this file, not the
# bottom. Only the year is known per photo, so the stable sort keeps same-year
# photos in the order written here.
#
# photo     filename only; resolved under /assets/images/gallery/.
#           Several photos from one event share a base name with a -2/-3 suffix.
# alt       Optional override. By default the <img alt> is built as
#           "<event>, <location>, <year>"; set `alt` only when that reads wrong.
