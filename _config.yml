# Jekyll configuration for the hand-built pages.
# index.html is the Kubio export. It carries only `layout: null` front matter so
# Jekyll will expand its {% include header.html %} (the shared nav); everything
# else in it passes through untouched. Do NOT add a `defaults:` layout here —
# that would wrap the export in a second <html>/<head> and wreck it.
title: Women in Induced Proximity Community
description: A community-led hub for women in targeted protein degradation and induced proximity science.

# Keep the build output clean.
exclude:
  - Gemfile
  - Gemfile.lock
  - Readme.md
  - CLAUDE.md
  - ISSUES.md
  - docs
  - vendor
  - .claude
