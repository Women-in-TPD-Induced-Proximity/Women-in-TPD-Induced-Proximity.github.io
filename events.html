<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Women in Induced Proximity Community — Events</title>
  <meta name="description" content="Upcoming meetups, symposia, and community gatherings." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">MC</span>
        <span class="brand-text"><strong>Women in Induced Proximity</strong><span class="muted">Community</span></span>
      </a>

      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" data-nav>
        <a href="mission.html">Mission</a>
        <a href="core-team.html">Core Team</a>
        <a href="index.html#join">Join</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page-hero">
      <div class="container">
        <h1>Events</h1>
        <p class="lead muted">Meetups, panels, and community gatherings. Add new events in <code>assets/data/events.json</code>.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="field">
            <label for="search" class="muted">Search</label>
            <input id="search" type="search" placeholder="Search title, venue, city…" />
          </div>
          <div class="field">
            <label for="type" class="muted">Type</label>
            <select id="type">
              <option value="">All</option>
              <option value="Meetup">Meetup</option>
              <option value="Panel">Panel</option>
              <option value="Workshop">Workshop</option>
              <option value="Symposium">Symposium</option>
              <option value="Virtual">Virtual</option>
            </select>
          </div>
        </div>

        <div class="events-grid" data-events-target="all"></div>
        <p class="tiny muted">This page is fully static; filtering happens in the browser.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p class="tiny muted">© <span id="year"></span> Women in Induced Proximity Community.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/render-events.js"></script>
</body>
</html>
